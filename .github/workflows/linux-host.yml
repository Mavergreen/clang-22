name: linux-host
on:
  push:
    branches: [linux-host]
    paths:
      - 'build/**'
      - 'patches/**'
      - '.github/workflows/linux-host.yml'
      - 'UPSTREAM_VERSION'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Build locked host environment
        run: docker build --build-arg "BASE_IMAGE=$(cat build/linux/base-image)" -t clang22-linux-build build/linux
      - name: Build Linux host tools
        run: |
          mkdir -p "$RUNNER_TEMP/linux-work"
          docker run --rm -v "$PWD:/src:ro" -v "$SHIPYARD_SCRIPTS:/shipyard:ro" \
            -v "$RUNNER_TEMP/linux-work:/work" -w /src \
            -e SHIPYARD_SCRIPTS=/shipyard -e MAVERICKS_WORK=/work \
            clang22-linux-build sh build/build-linux.sh
      - name: Archive Linux host tools
        run: tar -czf "$RUNNER_TEMP/linux-host.tar.gz" -C "$RUNNER_TEMP/linux-work" linux-host
      - uses: actions/upload-artifact@v7
        with:
          name: clang22-linux-host
          path: ${{ runner.temp }}/linux-host.tar.gz
          if-no-files-found: error
