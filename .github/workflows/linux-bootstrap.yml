name: linux-bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04@sha256:98510ac07bb4545e389be502a8918b385c018bfe4ceeb5ac7e0375c782268b04
    steps:
      - name: Resolve bootstrap build packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-12 g++-12 cmake ninja-build gnupg python3 curl xz-utils make patch git binutils ca-certificates
          mkdir -p inventory
          dpkg-query -W -f='${binary:Package}=${Version}\n' | LC_ALL=C sort > inventory/packages.lock
          gcc-12 --version > inventory/compiler.txt
          ldd --version > inventory/libc.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bootstrap-inventory
          path: inventory
          if-no-files-found: error
