name: release

# Both clang-22 variants, built on FREE standard macos runners. A push to main that brings a new LLVM
# upstream auto-cuts <upstream>-mavericks.1; a tag publishes that tag; a local_release dispatch cuts the
# next -mavericks.N; anything else builds without publishing. build-cross (the big build: clang+lld +
# the x86_64/10.9 runtimes, which it also relinks and packages as libcxx22) hands its staged
# toolchain to build-native, which cross-HOSTS the x86_64/10.9 clang using it as the compiler. No
# 10.9 runner anywhere; the compat guards + emitted-binary smokes are the in-CI equivalence proof.

on:
  push:
    branches: [main]
    tags: ['*-mavericks.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a local -mavericks.(N+1) repackage for the current upstream"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main can publish here (when it brings a new upstream), like most of the family's product
# repos, which is exactly why no run that can publish may share a group.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fixed, deterministic scratch dir OUTSIDE the checkout, so the cross job's staged toolchain lands
  # exactly where build-native.sh (which derives WORK from this) looks for it after the handoff.
  MAVERICKS_WORK: ${{ github.workspace }}/../mav-work
  MAVERICKS_USE_CCACHE: "1"

jobs:
  build-cross:
    runs-on: macos-26   # Apple Silicon (arm64); use macos-15 if 26 unavailable
    timeout-minutes: 355   # safety cap, under GitHub's 360-minute hard limit
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # version.sh counts existing <upstream>-mavericks.* tags

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      # spec: build/lib.sh -- the Sparkle updater's CMake build (an explicit -S/-B call, never a
      # preset, so this plain env var reaches it) lands here instead of build/updater-cross/.
      # $RUNNER_TEMP (a real env var, not the ${{ runner.temp }} context expression) because the
      # runner context is not resolvable in a workflow- or job-level env: -- only inside a step.
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      # gpg verifies the LLVM source tarball (the signature is what makes a Renovate bump
      # self-contained); ccache is what makes every build after the first one cheap.
      - name: Ensure gpg + ccache
        run: |
          command -v gpg >/dev/null 2>&1 || brew install gnupg
          command -v ccache >/dev/null 2>&1 || brew install ccache

      - name: Resolve version (force no-publish off main/non-tag)
        id: ver
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            full="$GITHUB_REF_NAME"; rel=yes
          else
            mode="$(sh "$SHIPYARD_SCRIPTS/release-mode.sh")"
            out="$(sh build/version.sh "$mode")"
            full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
            rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
            [ "$GITHUB_REF_NAME" = main ] || rel=no
          fi
          printf '%s\n' "$full" > VERSION
          { echo "full=$full"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$rel"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LOCAL_RELEASE: ${{ inputs.local_release }}

      - name: Restore ccache (cross)
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-cross-${{ hashFiles('UPSTREAM_VERSION','build/build-cross.sh','build/versions.sh','patches/**') }}
          restore-keys: ccache-${{ runner.os }}-cross-

      - name: Run the repo's tests + guard ingredient pins
        run: |
          sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"
          sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      - name: Cross-build the toolchain (ccache)
        id: cross
        run: sh build/build-cross.sh

      # The restore step above saves the cache only when the whole job succeeds. A cold rebuild that
      # then fails late -- build-cross.sh's own compat guard, relocatability, the smoke -- would lose
      # hours of ccache and make the rerun cold too, so save it here whatever happened. The key is the
      # restore key plus this run and attempt: a cache key can never be overwritten, so a partial
      # cache saved under the restore key itself would lock it for good. The restore step's
      # restore-keys prefix picks the newest of these up, and a successful job still saves under the
      # exact restore key as before. Not when the build never ran: there is nothing new to save.
      - name: Save ccache (cross), even when the build or a later check fails
        if: ${{ !cancelled() && steps.cross.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-cross-${{ hashFiles('UPSTREAM_VERSION','build/build-cross.sh','build/versions.sh','patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # A defence-in-depth guard: build-cross.sh runs under `set -e`, so a failed build already fails
      # the job, but this turns a subtly-empty stage into a clear message before the later steps.
      - name: Assert the toolchain was staged
        run: |
          set -eu
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          [ -x "$MAVERICKS_WORK/stage$CROSS_PREFIX/bin/clang" ] \
            || { echo "::error::cross build produced no staged clang"; exit 1; }

      - name: Export validated Mavericks target files
        run: |
          set -eu
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          sh build/export-target.sh "$MAVERICKS_WORK/stage$CROSS_PREFIX" "$MAVERICKS_WORK/target-export"
          sh build/target-manifest.sh verify "$MAVERICKS_WORK/target-export"
          tar -czf "$RUNNER_TEMP/target-export.tar.gz" -C "$MAVERICKS_WORK" target-export

      - name: Upload Mavericks target export
        uses: actions/upload-artifact@v7
        with:
          name: clang22-target-export
          path: ${{ runner.temp }}/target-export.tar.gz
          if-no-files-found: error

      - name: Relocatability gate
        run: |
          set -eu
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          sh build/verify-relocatable.sh "$MAVERICKS_WORK/stage$CROSS_PREFIX"

      - name: Compat gate + emitted-binary smoke
        run: sh tests/smoke-target.sh

      # macOS 27's SDK stubs list arm64e.x1, which unpatched 22.1.8 cannot read (patches/0001).
      - name: ld64.lld reads .tbd stubs that list arm64e.x1
        run: sh tests/tbd-arch-test.sh

      # 10.9's dyld coalesces weak symbols only from name-sorted weak binding info (patches/0002).
      - name: ld64.lld writes weak bindings in name order
        run: sh tests/weak-bind-order-test.sh

      # Before 10.14 an exception object is 8-byte aligned; a value caught by value is read so (patches/0003).
      - name: A caught value is read at the exception object's alignment
        run: sh tests/catch-align-test.sh

      # Exit 77 (cannot execute x86_64) fails this step on purpose: see the test's header.
      - name: Coverage works (profile runtime links, runs, reads back)
        run: sh tests/profile-runtime-test.sh

      # A small Cocoa/ObjC build (no LLVM), so it rides in this job rather than paying for its own.
      # The arm64 Sparkle slice is derived from the updater's CMAKE_OSX_ARCHITECTURES by
      # mavericks_add_updater_app -- nothing here hand-plumbs a framework path.
      - name: Build the cross Sparkle updater (arm64/11)
        run: |
          set -eu
          shipyard-cmake -S . -B "$MAVERICKS_BUILD_ROOT/clang-updater-cross" -DCLANG_VARIANT=cross \
            -DMAVERICKS_ALLOW_GENERIC_ICON=ON -DCMAKE_OBJC_COMPILER=/usr/bin/clang \
            -DCMAKE_TOOLCHAIN_FILE="$SHIPYARD_SCRIPTS/../MavericksToolchain.cmake"
          shipyard-cmake --build "$MAVERICKS_BUILD_ROOT/clang-updater-cross" --target clang22-cross-updater
          # Self-update circularity: an updater that linked the toolchain it replaces could not run
          # while replacing it. Cocoa + Sparkle only.
          # `sed 1d` drops otool's header line, which is the binary's OWN PATH -- grepping it too
          # makes the gate fail whenever the build directory happens to be named after the product
          # (it did, locally, under ~/.cache/mavericks-clang/work). Dependencies only.
          otool -L "$MAVERICKS_BUILD_ROOT/clang-updater-cross/clang22-cross-updater.app/Contents/MacOS/clang22-cross-updater" > "$RUNNER_TEMP/otool-cross-all.txt"
          cat "$RUNNER_TEMP/otool-cross-all.txt"
          sed 1d "$RUNNER_TEMP/otool-cross-all.txt" > "$RUNNER_TEMP/otool-cross.txt"
          ! grep -qiE 'usr/local/mavergreen/' "$RUNNER_TEMP/otool-cross.txt" || { echo "::error::cross updater links a product tree"; exit 1; }

      - name: Package the cross .pkg + build-info
        run: UPD_APP="$MAVERICKS_BUILD_ROOT/clang-updater-cross/clang22-cross-updater.app" sh build/package-cross-pkg.sh

      - name: Upload cross artifacts (pkg + build-info)
        uses: actions/upload-artifact@v7
        with:
          name: variant-cross
          path: |
            dist/*cross*.pkg
            dist/build-info-cross.txt

      # libcxx22: libc++ relinked from the runtimes archive above, beside a libc++abi.1 that re-exports
      # the system's (build/build-libcxx.sh), shipped beside clang22. It
      # lives in this job because the archives and the cross clang are here; its x86_64/10.9 updater
      # builds on this arm64 runner exactly as the native one does.
      - name: Relink libc++/libc++abi as the libcxx22 runtime dylibs
        run: sh build/build-libcxx.sh

      - name: libcxx22 shape + parity against Wowfunhappy's libc++
        run: sh tests/libcxx-shape-test.sh

      - name: libcxx22 runs a C++ program (exceptions, iostreams, threads)
        run: sh tests/libcxx-runtime-test.sh

      # One C++ ABI, the system's: exceptions cross between our code, the system's C++ and Cocoa, in
      # the toolchain's own static link and through libcxx22. Exit 77 (cannot execute x86_64) fails it.
      - name: One C++ ABI across our code, the system's C++ and Cocoa
        run: sh tests/cxxabi-interop-test.sh

      - name: Export matching libcxx22 test libraries
        run: |
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          tar -czf "$RUNNER_TEMP/libcxx-test.tar.gz" -C "$LIBCXX_STAGE" lib
      - uses: actions/upload-artifact@v7
        with:
          name: clang22-libcxx-test
          path: ${{ runner.temp }}/libcxx-test.tar.gz
          if-no-files-found: error

      - name: Build the libcxx22 Sparkle updater (x86_64/10.9)
        run: |
          set -eu
          shipyard-cmake -S . -B "$MAVERICKS_BUILD_ROOT/clang-updater-libcxx" -DCLANG_VARIANT=libcxx \
            -DMAVERICKS_ALLOW_GENERIC_ICON=ON -DCMAKE_OBJC_COMPILER=/usr/bin/clang \
            -DCMAKE_TOOLCHAIN_FILE="$SHIPYARD_SCRIPTS/../MavericksToolchain.cmake"
          shipyard-cmake --build "$MAVERICKS_BUILD_ROOT/clang-updater-libcxx" --target libcxx22-updater
          # sed 1d: otool's header line is the binary's own path, not a dependency -- see the cross updater.
          otool -L "$MAVERICKS_BUILD_ROOT/clang-updater-libcxx/libcxx22-updater.app/Contents/MacOS/libcxx22-updater" > "$RUNNER_TEMP/otool-libcxx-all.txt"
          cat "$RUNNER_TEMP/otool-libcxx-all.txt"
          sed 1d "$RUNNER_TEMP/otool-libcxx-all.txt" > "$RUNNER_TEMP/otool-libcxx.txt"
          ! grep -qiE 'usr/local/mavergreen/' "$RUNNER_TEMP/otool-libcxx.txt" || { echo "::error::libcxx22 updater links a product tree"; exit 1; }

      - name: Package the libcxx22 .pkg + build-info
        run: UPD_APP="$MAVERICKS_BUILD_ROOT/clang-updater-libcxx/libcxx22-updater.app" sh build/package-libcxx-pkg.sh

      - name: Upload libcxx22 artifacts (pkg + build-info)
        uses: actions/upload-artifact@v7
        with:
          name: variant-libcxx
          path: |
            dist/libcxx*.pkg
            dist/build-info-libcxx.txt

      # TAR, not a raw directory upload. upload-artifact does not preserve the executable bit and
      # dereferences symlinks: the staged prefix is full of both (bin/clang -> clang-22, the versioned
      # dylib chains), so a plain upload arrives with a non-executable clang -- build-native.sh's
      # `[ -x .../bin/clang ]` guard then reports "run build-cross.sh first" on a tree that is right
      # there -- and inflates from dereferencing every link.
      #
      # The LLVM SOURCE TARBALL travels too. build-native.sh requires $WORK/llvm-project-<ver>.src,
      # which build-cross.sh unpacked; a fresh build-native runner has no such tree and would fail at
      # once. Shipping the 159MB verified tarball and unpacking it there costs far less than the 2.3GB
      # extracted tree, and it is already GPG-verified, so it needs no re-verification.
      - name: Pack the cross handoff (modes + symlinks preserved)
        run: |
          set -eu
          cd "$MAVERICKS_WORK"
          tar -cf "$RUNNER_TEMP/cross-handoff.tar" stage llvm-project-*.src.tar.xz

      - name: Upload the cross handoff (ephemeral; NEVER a release asset)
        uses: actions/upload-artifact@v7
        with:
          name: cross-toolchain-stage
          retention-days: 1
          path: ${{ runner.temp }}/cross-handoff.tar

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  build-native:
    needs: build-cross
    runs-on: macos-26
    timeout-minutes: 355   # safety cap, under GitHub's 360-minute hard limit
    # The native build's compiler is the freshly-built cross clang, whose binary differs every run, so
    # ccache's default (mtime/content) check treats it as a NEW compiler and misses on everything. Key
    # the compiler on its --version string instead -- stable for a given LLVM version, invalidated by a
    # bump -- so the native build gets cache hits like the cross build does.
    env:
      CCACHE_COMPILERCHECK: "%compiler% --version"
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      # See build-cross's identical step: the updater's CMake build reads this directly.
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Ensure ccache
        run: command -v ccache >/dev/null 2>&1 || brew install ccache

      # Both variants MUST label themselves with one version. build-cross already resolved it; writing
      # it here means package-native-pkg.sh reuses that answer instead of re-deriving from tags, which
      # a tag pushed mid-run could answer differently -- two halves of one release disagreeing is the
      # exact failure resolve-version.sh exists to prevent.
      - name: Pin the version resolved by build-cross
        run: printf '%s\n' "${{ needs.build-cross.outputs.version }}" > VERSION

      - name: Restore the cross handoff (the build-native.sh compiler + LLVM source)
        uses: actions/download-artifact@v8
        with:
          name: cross-toolchain-stage
          path: ${{ runner.temp }}

      - name: Unpack the handoff
        run: |
          set -eu
          mkdir -p "$MAVERICKS_WORK"
          tar -C "$MAVERICKS_WORK" -xf "$RUNNER_TEMP/cross-handoff.tar"
          cd "$MAVERICKS_WORK" && tar -xf llvm-project-*.src.tar.xz

      - name: Restore ccache (native)
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-native-${{ hashFiles('UPSTREAM_VERSION','build/build-native.sh','build/versions.sh','patches/**') }}
          restore-keys: ccache-${{ runner.os }}-native-

      - name: Cross-host the native toolchain (x86_64/10.9)
        run: sh build/build-native.sh

      - name: Assert the native toolchain was staged
        run: |
          set -eu
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          [ -x "$MAVERICKS_WORK/stage-native$NATIVE_PREFIX/bin/clang" ] \
            || { echo "::error::native build produced no staged clang"; exit 1; }

      # Relocatability + the compat guard on the native HOST binaries -- the check the cross variant
      # cannot run, its host tools being arm64 by design. The Rosetta step inside is non-gating for
      # availability, but a compile that fails once Rosetta demonstrably works is a real defect.
      - name: Native host-binary compat guard + Rosetta smoke
        run: sh tests/smoke-native.sh

      # The native prefix carries the cross build's profile runtime by copy (build-native.sh step 5),
      # so prove the copy, with the native llvm-profdata/llvm-cov, under Rosetta.
      - name: Native coverage works (profile runtime links, runs, reads back)
        run: |
          set -eu
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          TC="$MAVERICKS_WORK/stage-native$NATIVE_PREFIX" sh tests/profile-runtime-test.sh

      # Same check as the cross job's, on the native ld64.lld (x86_64, so under Rosetta here).
      - name: Native ld64.lld reads .tbd stubs that list arm64e.x1
        run: |
          set -eu
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          TC="$MAVERICKS_WORK/stage-native$NATIVE_PREFIX" sh tests/tbd-arch-test.sh

      - name: Native ld64.lld writes weak bindings in name order
        run: |
          set -eu
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          TC="$MAVERICKS_WORK/stage-native$NATIVE_PREFIX" sh tests/weak-bind-order-test.sh

      - name: Native clang reads a caught value at the exception object's alignment
        run: |
          set -eu
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          TC="$MAVERICKS_WORK/stage-native$NATIVE_PREFIX" sh tests/catch-align-test.sh

      # The native toolchain's own static C++ link (no libcxx22 in this job), under Rosetta here.
      - name: Native toolchain uses one C++ ABI across our code, the system's C++ and Cocoa
        run: |
          set -eu
          REPO_ROOT="$PWD"; export REPO_ROOT; . ./build/versions.sh
          TC="$MAVERICKS_WORK/stage-native$NATIVE_PREFIX" sh tests/cxxabi-interop-test.sh

      # x86_64/min-10.9, because this updater RUNS on the 10.9 box it updates. Built by the runner's
      # Apple clang against the modern SDK -- Cocoa/Sparkle only, so it needs none of the 10.9 SDK
      # back-fills the toolchain build does.
      - name: Build the native Sparkle updater (x86_64/10.9)
        run: |
          set -eu
          shipyard-cmake -S . -B "$MAVERICKS_BUILD_ROOT/clang-updater" -DCLANG_VARIANT=native \
            -DMAVERICKS_ALLOW_GENERIC_ICON=ON -DCMAKE_OBJC_COMPILER=/usr/bin/clang \
            -DCMAKE_TOOLCHAIN_FILE="$SHIPYARD_SCRIPTS/../MavericksToolchain.cmake"
          shipyard-cmake --build "$MAVERICKS_BUILD_ROOT/clang-updater" --target clang22-updater
          # sed 1d: otool's header line is the binary's own path, not a dependency -- see the cross job.
          otool -L "$MAVERICKS_BUILD_ROOT/clang-updater/clang22-updater.app/Contents/MacOS/clang22-updater" > "$RUNNER_TEMP/otool-native-all.txt"
          cat "$RUNNER_TEMP/otool-native-all.txt"
          sed 1d "$RUNNER_TEMP/otool-native-all.txt" > "$RUNNER_TEMP/otool-native.txt"
          ! grep -qiE 'usr/local/mavergreen/' "$RUNNER_TEMP/otool-native.txt" || { echo "::error::native updater links a product tree"; exit 1; }

      - name: Package the native .pkg (10.9.5 floor) + build-info
        run: UPD_APP="$MAVERICKS_BUILD_ROOT/clang-updater/clang22-updater.app" sh build/package-native-pkg.sh

      - name: Upload native artifacts (pkg + build-info)
        uses: actions/upload-artifact@v7
        with:
          name: variant-native
          path: |
            dist/*native*.pkg
            dist/build-info-native.txt

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  # Both variants exist only here, so this is the only place conformance can compare them.
  build-linux:
    needs: [build-cross]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - uses: actions/download-artifact@v8
        with: { name: clang22-target-export, path: inputs }
      - uses: actions/download-artifact@v8
        with: { name: clang22-libcxx-test, path: inputs }
      - name: Prepare matching build inputs
        env:
          BUILD_VERSION: ${{ needs.build-cross.outputs.version }}
        run: |
          printf '%s\n' "$BUILD_VERSION" > VERSION
          mkdir -p "$RUNNER_TEMP/linux-work/test-libcxx"
          tar -xzf inputs/target-export.tar.gz -C "$RUNNER_TEMP/linux-work"
          tar -xzf inputs/libcxx-test.tar.gz -C "$RUNNER_TEMP/linux-work/test-libcxx"
          docker build --build-arg "BASE_IMAGE=$(cat build/linux/base-image)" -t clang22-linux-build build/linux
      - name: Build and rehearse on the supported baseline
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$SHIPYARD_SCRIPTS:/shipyard:ro" \
            -v "$RUNNER_TEMP/linux-work:/work" -w /src \
            -e SHIPYARD_SCRIPTS=/shipyard -e MAVERICKS_WORK=/work \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            clang22-linux-build sh -c 'sh build/build-linux.sh && sh build/rehearse-linux.sh /work/target-export /work/test-libcxx/lib'
      - name: Package saved target witnesses
        run: tar -czf "$RUNNER_TEMP/linux-witnesses.tar.gz" -C "$RUNNER_TEMP/linux-work" witnesses
      - uses: actions/upload-artifact@v7
        with:
          name: variant-linux
          path: ${{ runner.temp }}/linux-work/linux-dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: linux-witnesses
          path: ${{ runner.temp }}/linux-witnesses.tar.gz
          if-no-files-found: error

  on-linux-mavericks:
    needs: [build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: linux-witnesses, path: inputs }
      - run: tar -xzf inputs/linux-witnesses.tar.gz
      - name: Run Linux-built witnesses on Mavericks
        uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          cpu: '4'
          mem: '8192'
          run: sh tests/target/runner.sh witnesses
      - run: tar -czf "$RUNNER_TEMP/linux-results.tar.gz" witnesses
      - uses: actions/upload-artifact@v7
        with:
          name: linux-target-results
          path: ${{ runner.temp }}/linux-results.tar.gz
          if-no-files-found: error

  verify-linux:
    needs: [build-linux, on-linux-mavericks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - uses: actions/download-artifact@v8
        with: { name: variant-linux, path: inputs }
      - uses: actions/download-artifact@v8
        with: { name: linux-target-results, path: inputs }
      - name: Verify on current Ubuntu and read target profile counts
        run: |
          mkdir -p "$RUNNER_TEMP/current compiler"
          tar -xzf inputs/clang22-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/current compiler"
          tar -xzf inputs/linux-results.tar.gz
          TC="$RUNNER_TEMP/current compiler/opt/mavergreen/clang22"; export TC
          sh build/verify-linux-host.sh "$TC"
          sh build/probe-linux-tools.sh "$TC"
          "$TC/bin/setup-sdk" "$(sh "$SHIPYARD_SCRIPTS/fetch_sdk.sh")"
          export NM="$TC/bin/llvm-nm" LIPO="$TC/bin/llvm-lipo" OTOOL="$TC/bin/llvm-otool" STRINGS="$TC/bin/llvm-strings"
          sh tests/smoke-target.sh
          sh tests/support/verify-profile.sh "$TC" "$PWD/witnesses/profile"
          printf 'PASS catch-align\nPASS weak-bind\nPASS cxxabi\nPASS profile\n' > expected-results
          cmp expected-results witnesses/results.txt

  collect:
    needs: [build-cross, build-native, build-linux]
    runs-on: macos-26   # pkgutil-based conformance needs macOS
    outputs:
      version: ${{ needs.build-cross.outputs.version }}
      publish: ${{ needs.build-cross.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - uses: actions/download-artifact@v8
        with: { name: variant-cross, path: dist }

      - uses: actions/download-artifact@v8
        with: { name: variant-native, path: dist }

      - uses: actions/download-artifact@v8
        with: { name: variant-libcxx, path: dist }

      - uses: actions/download-artifact@v8
        with: { name: variant-linux, path: dist }

      # The body travels IN the artifact: publish-release.yml does not check out the repo. One call
      # writes the file both sign_and_appcast.sh invocations below (native + cross) and the Release
      # body consume -- the same bytes, so the page and Sparkle's update dialog cannot disagree.
      #
      # --min-os 10.9.5 describes the NATIVE .pkg (the flagship most users install), not the cross
      # variant -- the cross feed below carries its own real floor (--min-os 11.0) independently.
      #
      # CLANG_LINE is derived the same way every other call site in this repo derives it
      # (version.sh, versions.sh): from the root UPSTREAM_VERSION, not configured here.
      - name: Stage release notes
        run: |
          set -eu
          VER="${{ needs.build-cross.outputs.version }}"
          CLANG_LINE="$(sh build/version.sh line)"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "$VER" --version "$VER" \
            --product Clang --line "$CLANG_LINE" --min-os 10.9.5 \
            --out dist/RELEASE_NOTES.md

      # BEFORE conformance, because conformance reads each updater's feed (clang22.xml,
      # clang22-cross.xml), which its updater polls at this repo's /releases/latest/download/.
      # Publishing runs only, so a fork PR never touches the secret.
      - name: EdDSA-sign both .pkgs and render the feeds
        if: needs.build-cross.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via gh
        run: |
          set -eu
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          VER="${{ needs.build-cross.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER"
          NPKG="$(ls dist/*native*.pkg | head -1)"
          XPKG="$(ls dist/*cross*.pkg | head -1)"
          LPKG="$(ls dist/libcxx*.pkg | head -1)"
          # dist/RELEASE_NOTES.md, staged above -- the SAME bytes the Release body uses, so the page
          # and Sparkle's update dialog cannot tell two different stories about one version.
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "Clang for Mavericks 22" --version "$VER" \
            --pkg-url "$base/$(basename "$NPKG")" --notes-file dist/RELEASE_NOTES.md \
            --pkg "$NPKG" --min-os 10.9.5 --product clang22 --feed-dir dist
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "Clang for Mavericks 22 (cross)" --version "$VER" \
            --pkg-url "$base/$(basename "$XPKG")" --notes-file dist/RELEASE_NOTES.md \
            --pkg "$XPKG" --min-os 11.0 --product clang22-cross --feed-dir dist
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "libc++ 22 for Mavericks" --version "$VER" \
            --pkg-url "$base/$(basename "$LPKG")" --notes-file dist/RELEASE_NOTES.md \
            --pkg "$LPKG" --min-os 10.9.5 --product libcxx22 --feed-dir dist
          echo "=== clang22.xml ==="; cat dist/clang22.xml
          echo "=== clang22-cross.xml ==="; cat dist/clang22-cross.xml
          echo "=== libcxx22.xml ==="; cat dist/libcxx22.xml

      - name: Artifact conformance (both variants agree; scheme/floor correct)
        if: needs.build-cross.outputs.publish == 'yes'
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ needs.build-cross.outputs.version }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      # Conformance says the feed is well-formed; this says an installed client will actually SEE
      # this release as newer than the one it is running -- the property "-mavericks.N" broke.
      - name: Assert each feed is an upgrade on its line
        if: needs.build-cross.outputs.publish == 'yes'
        run: |
          set -eu
          for a in clang22.xml clang22-cross.xml libcxx22.xml; do
            sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "dist/$a" \
              --version "${{ needs.build-cross.outputs.version }}" --upstream-glob "22.*"
          done

      # Exactly what the release carries -- the handoff tar is deliberately not among it.
      - name: Combine into the single release artifact
        uses: actions/upload-artifact@v7
        with:
          name: mavericks-clang
          path: |
            dist/*.pkg
            dist/RELEASE_NOTES.md
            dist/build-info-*.txt
            dist/clang22*.xml
            dist/libcxx22*.xml
            dist/clang22-*-linux-x86_64.tar.gz
            dist/clang22-*-linux-x86_64.manifest.json

  # The one place 10.9's own libc++abi and dyld meet what this release ships. The native toolchain and
  # libcxx22 are installed on a Mac OS X 10.9.5 guest, and the C++ ABI crash matrix and the weak-binding
  # test run there natively against the installed layout; publish waits for them. Under Rosetta on
  # macos-26 the build jobs prove the same shape against a modern libc++abi and dyld, which neither
  # bug needs to show itself. The guest has no Command Line Tools: every compile in it is the clang22
  # just installed, which needs Longboat's sdk109 (`longboat sdk install 10.9`) before its pkg installs. A
  # test's 77, its skip, is a failure here.
  on-mavericks:
    needs: [build-cross, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write   # mavericks-vm's shared image cache
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: variant-native, path: dist }
      - uses: actions/download-artifact@v8
        with: { name: variant-libcxx, path: dist }
      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1
      # The guest gets the workspace, not this runner's shipyard checkout: bring in the scripts the tests
      # source, and the pinned Longboat (components/longboat/version, CI only), verified against its
      # release's SHA256SUMS.
      - name: Bring shipyard's scripts and the pinned Longboat into the workspace
        run: |
          set -eu
          cp -R "$SHIPYARD_SCRIPTS" .shipyard-scripts
          lb="$(tr -d '[:space:]' < components/longboat/version)"
          sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" longboat "$lb" "longboat-$lb.pkg" deps
          ls dist deps
      - name: Install clang22 and libcxx22 on Mac OS X 10.9 and run the C++ ABI and linker tests there
        uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          cpu: '4'
          mem: '8192'
          run: |
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            for p in deps/longboat-*.pkg; do sudo installer -pkg "$p" -target /; done
            sudo /usr/local/mavergreen/longboat/bin/longboat sdk install 10.9
            for p in dist/*native*.pkg dist/libcxx*.pkg; do sudo installer -pkg "$p" -target /; done
            export SHIPYARD_SCRIPTS="$PWD/.shipyard-scripts"
            must() { status=0; "$@" || status=$?; [ "$status" -eq 0 ] || { echo "$* exited $status (77, a skip, is a failure here)"; exit 1; }; }
            I=/usr/local/mavergreen
            # No Command Line Tools here, so otool, nm, lipo and strings are stubs: the tests take
            # clang22's, which give the same answers (as the compat guard documents).
            export NM=$I/clang22/bin/llvm-nm OTOOL=$I/clang22/bin/llvm-otool LIPO=$I/clang22/bin/llvm-lipo STRINGS=$I/clang22/bin/llvm-strings
            must env TC=$I/clang22 LIBCXX_LIB=$I/libcxx22/lib sh tests/cxxabi-interop-test.sh
            must env TC=$I/clang22 sh tests/weak-bind-order-test.sh
            must env TC=$I/clang22 sh tests/catch-align-test.sh
            must env TC=$I/clang22 LIBCXX_LIB=$I/libcxx22/lib sh tests/libcxx-runtime-test.sh
            must env TC=$I/clang22 sh tests/profile-runtime-test.sh
            must env TC=$I/clang22 sh tests/tbd-arch-test.sh

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  scan:
    needs: [collect]
    if: always() && (needs.collect.outputs.publish == 'yes')   # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: mavericks-clang
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [collect, scan, on-mavericks, verify-linux]
    if: needs.collect.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.collect.outputs.version }}
      artifact: mavericks-clang
